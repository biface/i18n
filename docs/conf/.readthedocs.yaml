# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Build documentation from docs/source/ with Sphinx (Furo theme).
# fail_on_warning matches the same policy as .github/workflows/docs-ghpages.yml
# (-W flag) — DD-33: "Built in CI, warnings as errors".
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

# Native uv support (RTD >= 2025): installs the project + the "docs"
# dependency group declared in pyproject.toml's [dependency-groups],
# consistent with how docs-ghpages.yml installs the same group via
# `uv sync --group docs`.
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
