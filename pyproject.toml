# =============================================================================
# pyproject.toml — i18n-tools
# =============================================================================
# Single configuration file for packaging, toolchain, and test orchestration.
# Build system, project metadata, runtime dependencies, optional extras, and
# development dependency groups (PEP 735, managed by uv).
#
# Tool configuration (flake8, isort, basedpyright, bandit, pytest, coverage,
# tox) is fully consolidated here — tox.ini removed (unification, 2026-08-25).
# flake8's [tool.flake8] section below is inert without the Flake8-pyproject
# plugin (not a dependency here, by choice — see the [tool.tox.env.flake8]
# comment): flake8's real, effective config is passed as explicit CLI flags
# in that env's `commands`, the same pattern already used for bandit's
# `-c pyproject.toml` and matching the approach validated on django-clade.
#
# Dependency groups:
#   uv sync --group dev    — full development toolchain (tox, quality, tests)
#   uv sync --group docs   — Sphinx documentation build only
# =============================================================================

# -----------------------------------------------------------------------------
# Build system
# -----------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicit package location — required since [project].name
# ("pyi18t-tools") no longer matches the src/ folder name
# ("i18n_tools"). hatchling's default src-layout auto-detection derives
# the expected folder from the project name; without this override it
# would look for src/pyi18t_tools/ and find nothing. The importable
# module stays `i18n_tools` regardless of the PyPI distribution name —
# no code changes needed anywhere else.
[tool.hatch.build.targets.wheel]
packages = ["src/i18n_tools"]

[tool.hatch.build.targets.sdist]
include = [
    "src/i18n_tools",
]

# -----------------------------------------------------------------------------
# Project metadata
# -----------------------------------------------------------------------------
[project]
# Distribution name on PyPI/TestPyPI — "i18n-tools" was rejected by
# TestPyPI ("too similar to an existing project", likely RF-i18n-tool,
# one character away after normalization). "pyi18t-tools" ties to the
# project's own .i18t format (DD-10) rather than a personal name, and
# adds enough edit distance from the crowded i18n-tool(s)/i18tool
# namespace to be safe (no exact or near match found on PyPI at the
# time of writing — final confirmation only comes from the actual
# upload, PyPI's similarity check is not publicly documented).
# The importable package remains `i18n_tools` (src/i18n_tools/) —
# `pip install pyi18t-tools` + `import i18n_tools`, unchanged.
name = "pyi18t-tools"
version = "0.10.0"
authors = [
    { name = "biface" },
]
description = "Toolbox to manage localized messages with json and gettext functions."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: CeCILL-C Free Software License Agreement (CECILL-C)",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

# -----------------------------------------------------------------------------
# Runtime dependencies — required by any consumer of the package
# -----------------------------------------------------------------------------
dependencies = [
    "ndict-tools>=1.2.0",
    "babel",
    "langcodes",        # IETF tag normalisation — locale.py (DD-14)
    "PyYAML",           # .yaml / .i18t file loading — loaders/utils.py
]

# -----------------------------------------------------------------------------
# Project URLs
# -----------------------------------------------------------------------------
[project.urls]
Homepage   = "https://github.com/biface/i18n"
Repository = "https://github.com/biface/i18n.git"
Issues     = "https://github.com/biface/i18n/issues"

# -----------------------------------------------------------------------------
# CLI entry point (#39) — `i18n-tools validate|info|sync|repl`
# -----------------------------------------------------------------------------
[project.scripts]
i18n-tools = "i18n_tools.cli:main"

# -----------------------------------------------------------------------------
# Optional extras — for consumers who want to run the test suite
# without the full development toolchain
# -----------------------------------------------------------------------------
[project.optional-dependencies]
# Config/Repository/CLI usage: author & translator management (email format
# validation, translator API URL syntax/availability checks), and reading
# or writing a `.toml` settings file (`.yaml`/`.json` settings files need
# no extra). Core .i18t usage (Message/Book/Corpus/Encyclopaedia/formatter)
# never needs this (DD-41). Imports are lazy at the point of use — see
# api.py/config.py/loaders/settings.py.
api = [
    "requests",         # HTTP calls — api.py (validate_api_url)
    "validators",       # URL syntax check — api.py (validate_url_format, DD-37)
    "email-validator",  # email validation — config.py
    "toml",             # .toml settings file — loaders/settings.py (#119)
]
test = [
    "pytest",
    "pytest-cov",
]

# -----------------------------------------------------------------------------
# Development dependency groups (PEP 735) — managed exclusively by uv
# Not installed when a user does `pip install pyi18t-tools`
#
# Usage:
#   uv sync --group dev    → installs tox, quality tools, test runners
#   uv sync --group docs   → installs Sphinx and theme
#   uv sync --group dev --group docs  → both at once
# -----------------------------------------------------------------------------
[dependency-groups]
dev = [
    # tox orchestration — >=4.21 required for native [tool.tox] pyproject.toml support
    "tox>=4.21",
    "tox-uv",
    # test runners
    "pytest",
    "pytest-cov",
    # quality — static analysis
    "basedpyright",
    # quality — linting and formatting
    "flake8",
    "black",
    "isort",
    # quality — security
    "bandit",
]
docs = [
    "Sphinx",
    "furo",
]

# -----------------------------------------------------------------------------
# Tool configuration
# -----------------------------------------------------------------------------

[tool.basedpyright]
pythonVersion = "3.10"
pythonPlatform = "Linux"
stubPath = "stubs"
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportAny = false
reportImportCycles = false

[tool.isort]
profile = "black"
line_length = 88
known_first_party = "i18n_tools"
multi_line_output = 3
include_trailing_comma = true

[tool.bandit]
# B202: tarfile traversal controlled via _non_traversal_path() in loaders.py
skips = ["B202"]
# Only read when invoked with `bandit -c pyproject.toml` (see
# [tool.tox.env.bandit] below) — bandit does not auto-discover pyproject.toml.

[tool.pytest.ini_options]
markers = [
    "network: mark test as requiring real network access (deactivated on dev branches)",
    "timeout: mark test as making slow HTTP calls (excluded from CI)",
]

[tool.coverage.run]
branch = true
source = ["src/i18n_tools"]

[tool.coverage.report]
# This is now the SOLE coverage config source — a stray .coveragerc used
# to take silent precedence over this entire file (coverage.py's config
# discovery order is .coveragerc > setup.cfg > tox.ini > pyproject.toml,
# first file found with any settings wins, all others ignored). Removed
# 2026-07-27; its only still-useful pattern (def __repr__) is folded in
# below. Its `omit` list (.tox/docs/tests/.venv) was already a no-op
# given source = ["src/i18n_tools"] above, and its
# `if __name__ = "__main__"` pattern had a typo (single "=") and never
# matched anything.
#
# Excludes the 13 functions in converter.py decorated @_deprecated_unmaintained
# (the intermediate "unified format" bridge, all Catalog/i18next converters,
# and seek_translation) from coverage counting. Confirmed empirically that
# matching a decorator line via exclude_also excludes the whole decorated
# def block (signature + body), not just the decorator line itself. These
# functions have no caller anywhere in this package (see the module-level
# status note at the top of converter.py) — counting them as "missing"
# would misrepresent the converter component's real coverage.
exclude_also = [
    "@_deprecated_unmaintained",
    "def __repr__",
]

# -----------------------------------------------------------------------------
# tox — test orchestration
#
# Migrated from tox.ini (unification, 2026-08-25) — same ~20 environments,
# functionally unchanged. Notable drops during migration:
#   - [gh-actions] section: dead code. python-ci.yaml's test-unit job maps
#     the Python matrix to a tox env itself (`tox -e py${PYVER}`) and never
#     installs tox-gh-actions — this section's automatic mapping was never
#     actually consulted, likely a survivor from before the DD-36
#     amendment/#90 single-file workflow redesign.
#   - [flake8] (tox.ini) / [tool.flake8] (pyproject.toml, already dead —
#     confirmed empirically: flake8 does not read pyproject.toml without
#     the Flake8-pyproject plugin, not a dependency here): consolidated as
#     explicit CLI flags in env.flake8's commands below, sourced from
#     tox.ini's version (the one actually in effect).
#   - [isort] (tox.ini): was already redundant — isort reads [tool.isort]
#     above natively; both ultimately resolved to the same settings via
#     profile = "black", confirmed via `isort --show-config`.
#
# Scripts shared, unmodified: .tox-config/scripts/test.sh (reads
# versions.txt), .tox-config/scripts/coverage.sh (reads
# coverage-version.txt) — same convention as django-clade/ndict-tools.
#
# Refs: DD-36, DD-39 (coverage-gate)
# -----------------------------------------------------------------------------
[tool.tox]
requires = ["tox>=4.21", "tox-uv"]
env_list = [
    "py310", "py311", "py312", "py313", "py314",
    "integration",
    "basedpyright", "flake8", "black-check", "isort-check", "bandit",
    "black", "isort", "format",
    "ci-quality", "coverage", "coverage-gate",
    "pre-push", "local",
]

# Base for all py3NN test environments. Quality/coverage/workflow
# environments override deps/commands entirely.
[tool.tox.env_run_base]
runner = "uv-venv-runner"
set_env = { PYTHONPATH = "{toxinidir}/src:{toxinidir}/tests" }
uv_seed = true
# The test suite exercises Config/Repository author & translator management
# (email format validation, translator API URL checks) — it needs the `api`
# extra even though core .i18t usage doesn't (DD-41, #118). Envs that
# override `deps` below (coverage, integration, local, pre-push) still
# inherit this `extras` value unless they redefine it themselves.
extras = ["api"]
deps = ["-r {toxinidir}/.tox-config/requirements/base.txt"]
# tests/core + tests/api, excluding tests/api/integration (real network
# calls, tag-only — see env.integration). Directory-based exclusion
# replaces the old "-m not network and not timeout" marker filter: the
# core/api split (DD-41) made "does this need [api]" a directory boundary,
# and moving 00_api + the translator network tests under
# tests/api/integration/ made "is this a real network call" one too.
commands = [
    ["pytest", "--import-mode=importlib",
     "--cov=i18n_tools", "--cov-report=term-missing",
     "tests/core", "tests/api", "--ignore=tests/api/integration"],
]

# =============================================================================
# Core-only tests — no [api] extra installed at all
# CI job: test-core. Runs before test-unit: a genuine "[core] still stands
# on its own" regression here is more fundamental than any unit-test
# failure downstream, and cheaper to isolate before running the full
# [api] matrix (DD-41 review; same discipline this project intends to
# apply again if/when pyi18t-core/pyi18t-tools become separate packages).
# =============================================================================

[tool.tox.env.test-core]
description = "Run tests/core with no [api] extra installed at all"
base_python = "python3.12"
extras = []
deps = ["-r {toxinidir}/.tox-config/requirements/base.txt"]
commands = [
    ["pytest", "--import-mode=importlib", "tests/core"],
]

[tool.tox.env.py310]
base_python = "python3.10"

[tool.tox.env.py311]
base_python = "python3.11"

[tool.tox.env.py312]
base_python = "python3.12"

[tool.tox.env.py313]
base_python = "python3.13"

[tool.tox.env.py314]
base_python = "python3.14"

# =============================================================================
# Integration tests — real network calls (httpbingo.org)
# CI job: test-integration. Runs only on version tags and scheduled pipelines.
# =============================================================================

[tool.tox.env.integration]
description = "Integration tests requiring real network access"
base_python = "python3.12"
pass_env = ["HTTPBIN_BASE_URL", "GITHUB_REF", "CI_COMMIT_REF_NAME", "CI_COMMIT_TAG"]
deps = ["-r {toxinidir}/.tox-config/requirements/base.txt"]
commands = [
    ["pytest", "--import-mode=importlib", "-m", "not timeout",
     "tests/api/integration"],
]

# =============================================================================
# Coverage — full suite (unit + integration)
# CI job: coverage — runs on master, staging/**, pull_request, and tags.
# =============================================================================

[tool.tox.env.coverage]
description = "Generate coverage report (full suite, excludes only timeout)"
base_python = "python3.12"
pass_env = ["HTTPBIN_BASE_URL", "GITHUB_REF", "CI_COMMIT_REF_NAME", "CI_COMMIT_TAG"]
deps = ["-r {toxinidir}/.tox-config/requirements/base.txt"]
commands = [
    ["pytest", "--import-mode=importlib", "-m", "not timeout",
     "--cov=i18n_tools", "--cov-append", "--cov-report=term-missing",
     "--cov-report=xml:{toxinidir}/coverage/coverage.xml",
     "--cov-report=html:{toxinidir}/coverage/coverage_html",
     "tests/core", "tests/api"],
]

# =============================================================================
# Coverage gate — hard enforcement, release tags only (DD-39)
# --fail-under pinned to 0 (inert) until v1.0.0 — one-line change (0 -> 80)
# activates it. Reads the .coverage file already produced by env.coverage
# above, in the same CI job — does not re-run pytest.
# =============================================================================

[tool.tox.env."coverage-gate"]
description = "Hard coverage gate for release tags (inactive before v1.0.0 — threshold 0)"
skip_install = true
commands = [["coverage", "report", "--fail-under=0"]]

# =============================================================================
# Individual quality tools
# =============================================================================

[tool.tox.env.basedpyright]
description = "Static type checking with basedpyright"
deps = ["-r {toxinidir}/.tox-config/requirements/type-check.txt"]
allowlist_externals = ["bash"]
commands = [["bash", "-c", "basedpyright src; code=$?; [ $code -le 1 ]"]]

[tool.tox.env.flake8]
description = "Lint the code with flake8"
deps = ["-r {toxinidir}/.tox-config/requirements/linter.txt"]
allowlist_externals = ["flake8"]
commands = [
    ["flake8",
     "--max-line-length=88",
     "--extend-ignore=E203,W503,E501",
     "--exclude=.tox,.git,__pycache__,build,dist,.eggs,*.egg",
     "--per-file-ignores=tests/*:F401,F841,E711,E712,E731,F811,F541",
     "src", "tests"],
]

[tool.tox.env."black-check"]
description = "Check code formatting with black (no changes)"
deps = ["-r {toxinidir}/.tox-config/requirements/format.txt"]
commands = [["black", "--check", "--diff", "--target-version", "py310", "src", "tests"]]

[tool.tox.env."isort-check"]
description = "Check import sorting with isort (no changes)"
deps = ["-r {toxinidir}/.tox-config/requirements/format.txt"]
commands = [["isort", "--check-only", "--diff", "src", "tests"]]

[tool.tox.env.bandit]
description = "Security analysis with bandit"
deps = ["-r {toxinidir}/.tox-config/requirements/security.txt"]
allowlist_externals = ["bandit"]
commands = [["bandit", "-c", "pyproject.toml", "-r", "src"]]

# =============================================================================
# Auto-fix tools
# =============================================================================

[tool.tox.env.black]
description = "Auto-format code with black"
deps = ["-r {toxinidir}/.tox-config/requirements/format.txt"]
commands = [["black", "--target-version", "py310", "src", "tests"]]

[tool.tox.env.isort]
description = "Auto-sort imports with isort"
deps = ["-r {toxinidir}/.tox-config/requirements/format.txt"]
commands = [["isort", "src", "tests"]]

[tool.tox.env.format]
description = "Auto-format code (black then isort)"
deps = ["-r {toxinidir}/.tox-config/requirements/format.txt"]
commands = [
    ["black", "--target-version", "py310", "src", "tests"],
    ["isort", "src", "tests"],
]

# =============================================================================
# CI quality gate — verify only, no auto-fix
# =============================================================================

[tool.tox.env."ci-quality"]
description = "All quality checks chained (used by the CI quality job)"
deps = ["-r {toxinidir}/.tox-config/requirements/full.txt"]
allowlist_externals = ["bash", "flake8", "black", "isort", "bandit"]
commands = [
    ["bash", "-c", "basedpyright src; code=$?; [ $code -le 1 ]"],
    ["flake8",
     "--max-line-length=88",
     "--extend-ignore=E203,W503,E501",
     "--exclude=.tox,.git,__pycache__,build,dist,.eggs,*.egg",
     "--per-file-ignores=tests/*:F401,F841,E711,E712,E731,F811,F541",
     "src", "tests"],
    ["black", "--check", "--diff", "--target-version", "py310", "src", "tests"],
    ["isort", "--check-only", "--diff", "src", "tests"],
    ["bandit", "-c", "pyproject.toml", "-r", "src"],
]

# =============================================================================
# Local workflows
# =============================================================================

[tool.tox.env."pre-push"]
description = "Quality gate + unit tests before pushing"
deps = ["-r {toxinidir}/.tox-config/requirements/full.txt"]
allowlist_externals = ["bash"]
pass_env = ["HOME", "USER"]
commands = [
    ["black", "--target-version", "py310", "src", "tests"],
    ["isort", "src", "tests"],
    ["bash", "-c", "basedpyright src; code=$?; [ $code -le 1 ]"],
    ["flake8",
     "--max-line-length=88",
     "--extend-ignore=E203,W503,E501",
     "--exclude=.tox,.git,__pycache__,build,dist,.eggs,*.egg",
     "--per-file-ignores=tests/*:F401,F841,E711,E712,E731,F811,F541",
     "src", "tests"],
    ["bandit", "-c", "pyproject.toml", "-r", "src"],
    ["bash", "{toxinidir}/.tox-config/scripts/test.sh"],
    ["bash", "{toxinidir}/.tox-config/scripts/coverage.sh"],
]

[tool.tox.env.local]
description = "Full local workflow: auto-fix, all quality checks, full coverage"
deps = ["-r {toxinidir}/.tox-config/requirements/full.txt"]
allowlist_externals = ["bash"]
pass_env = ["HOME", "USER"]
commands = [
    ["black", "--target-version", "py310", "src", "tests"],
    ["isort", "src", "tests"],
    ["bash", "-c", "basedpyright src; code=$?; [ $code -le 1 ]"],
    ["flake8",
     "--max-line-length=88",
     "--extend-ignore=E203,W503,E501",
     "--exclude=.tox,.git,__pycache__,build,dist,.eggs,*.egg",
     "--per-file-ignores=tests/*:F401,F841,E711,E712,E731,F811,F541",
     "src", "tests"],
    ["bandit", "-c", "pyproject.toml", "-r", "src"],
    ["pytest", "--import-mode=importlib", "-m", "not timeout",
     "--cov=i18n_tools", "--cov-report=term-missing",
     "--cov-report=xml:{toxinidir}/coverage/coverage.xml",
     "--cov-report=html:{toxinidir}/coverage/coverage_html", "tests"],
]
