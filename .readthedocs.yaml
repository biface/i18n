# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html
#
# The same build as `tox -e docs`, which pre-push and
# .github/workflows/docs-ghpages.yml also run: Python 3.12, the pinned
# tools of .tox-config/requirements/docs.txt, the package with its `api`
# extra, warnings as errors. Paths are relative to the repository root.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

# Two installs, as tox does: pip, since the uv method takes a single entry.
python:
  install:
    - requirements: .tox-config/requirements/docs.txt
    - method: pip
      path: .
      extra_requirements:
        - api
