name: Deploy docs to GitHub Pages

# -----------------------------------------------------------------------------
# Single-version documentation deploy, triggered on final release tags only
# (no release-candidate tags). No sphinx-multiversion — deferred to v1.0.0
# (DD-33). Deliberately kept separate from python-ci.yaml (DD-36 amendment
# scope is quality -> test-unit -> test-integration -> coverage -> build ->
# publish; no docs job in that sequence).
# -----------------------------------------------------------------------------

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install documentation dependencies
        # --no-dev: keep the project + docs group, skip the (irrelevant here)
        # default dev group (tox, basedpyright, flake8, black, isort, bandit).
        run: uv sync --no-dev --group docs

      - name: Build docs
        # -W: warnings treated as errors (DD-33: "Built in CI, warnings as errors").
        run: uv run sphinx-build -b html -W docs/source docs/build/html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
          publish_branch: gh-pages
