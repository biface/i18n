name: Deploy docs to GitHub Pages

# -----------------------------------------------------------------------------
# Single-version documentation deploy, triggered on final release tags only
# (no release-candidate tags). No sphinx-multiversion — deferred to v1.0.0
# (DD-33). Deliberately kept separate from python-ci.yaml (DD-36 amendment
# scope is quality -> test-unit -> test-integration -> coverage -> build ->
# publish; no docs job in that sequence).
# -----------------------------------------------------------------------------

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install tox
        run: uv pip install --system tox tox-uv

      - name: Build docs
        # The tox docs environment: the same build as `tox -e docs` and the
        # pre-push gate locally (sphinx-build -E -W, warnings as errors,
        # DD-33), output in docs/build/html.
        run: tox -e docs

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
          publish_branch: gh-pages
