name: Python CI

# -----------------------------------------------------------------------------
# Single-file pipeline (DD-36 amendment, issue #90).
# Modelled on oxiflow/clade: one workflow file, jobs chained via `needs:`
# instead of the previous 5-file `workflow_run` design (abandoned — see
# DESIGN_DECISIONS.md §13).
#
# Sequence: quality -> test-unit -> {test-integration, coverage} -> build -> publish
# build / publish remain tag-only. test-integration remains tag-only (real
# network calls). coverage was opened up 2026-07-27 (v0.7.0, Option B): it
# now runs on master, staging/**, pull_request, AND tags — no longer
# tag-only — since it uses its own self-hosted go-httpbin container and no
# longer depends on test-integration in the `needs:` chain. This is what
# makes .codecov.yml's per-PR/per-push feedback actually useful during the
# coverage-focused v0.7.0 sprint (see PROJECT_STATUS.md).
#
# IMPORTANT: coverage's own hard enforcement step (`tox -e coverage-gate`,
# see pyproject.toml's [tool.tox.env."coverage-gate"]) stays tag-only
# regardless of the above — it is the real release gate (currently
# inert, --fail-under=0, activates at v1.0.0).
# Codecov's status checks (.codecov.yml) are `informational: true` and are
# NOT a release gate — GitHub branch protection required-status-checks do
# not apply to tags, only to branches, so Codecov can never block a
# release regardless of that flag. Do not conflate the two mechanisms.
# (no schedule trigger for now — deferred, see PROJECT_STATUS.md).
#
# 2026-07-27 — Node.js 24 migration: GitHub forced Node24 as the default
# Actions runtime on 2026-06-02 and removes Node20 entirely on
# 2026-09-16. Bumped: actions/checkout v4->v7, actions/setup-python
# v5->v6, codecov/codecov-action v5->v6, actions/upload-artifact
# v4->v6, actions/download-artifact v4->v7. astral-sh/setup-uv is
# pinned by commit SHA (v4->v9.0.0) rather than a floating tag: as of
# v8.0.0 that action no longer publishes moving major/minor tags at
# all (its own post-tj-actions security hardening) — @v9 does not
# resolve, only the full pinned version or its SHA do.
# softprops/action-gh-release (already @v3) and
# pypa/gh-action-pypi-publish (container-based, not Node) needed no
# change.
# -----------------------------------------------------------------------------

on:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  pull_request:
    branches:
      - "**"

jobs:
  # ---------------------------------------------------------------------------
  # Quality — basedpyright, flake8, black --check, isort --check, bandit
  # ---------------------------------------------------------------------------
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install tox
        run: uv pip install --system tox tox-uv

      - name: Run quality checks
        run: tox -e ci-quality

  # ---------------------------------------------------------------------------
  # Unit tests — matrix py310-py314, mocked (no network/timeout)
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true

    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install tox
        run: uv pip install --system tox tox-uv

      - name: Run unit tests
        run: |
          PYVER=$(echo "${{ matrix.python-version }}" | tr -d '.')
          tox -e py${PYVER}

  # ---------------------------------------------------------------------------
  # Integration tests — real network (httpbingo.org), tag-only
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: test-unit
    if: startsWith(github.ref, 'refs/tags/')

    # Self-hosted go-httpbin, same codebase as the public httpbingo.org
    # instance used by default outside CI (tests/helpers.py:HTTPBIN_BASE_URL).
    # Removes a dependency on an external service's uptime from the one job
    # that gates build/publish on a tag.
    services:
      httpbin:
        image: ghcr.io/mccutchen/go-httpbin
        ports:
          - 8080:8080

    env:
      HTTPBIN_BASE_URL: http://127.0.0.1:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install tox
        run: uv pip install --system tox tox-uv

      - name: Run integration tests
        run: tox -e integration

  # ---------------------------------------------------------------------------
  # Coverage — full suite, uploaded to Codecov (.codecov.yml components)
  #
  # Opened up 2026-07-27 (v0.7.0, Option B): runs on master, staging/**,
  # pull_request, and tags — no longer tag-only. Depends only on test-unit
  # (not test-integration) so it can run in contexts where test-integration
  # doesn't (non-tag pushes/PRs). Runs its own go-httpbin container,
  # independent of test-integration's.
  #
  # The Codecov upload/status below is informational only (.codecov.yml,
  # informational: true) — it is NOT the release gate. The real gate is the
  # separate, tag-only "Enforce coverage gate" step at the end of this job.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test-unit
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/heads/staging/') ||
      github.event_name == 'pull_request'

    # Coverage runs the full suite (only "not timeout" excluded, network
    # tests included). Own service container — no longer shared/ordered
    # with test-integration's, since the two jobs may now run in different
    # contexts (test-integration is tag-only; coverage is not).
    services:
      httpbin:
        image: ghcr.io/mccutchen/go-httpbin
        ports:
          - 8080:8080

    env:
      HTTPBIN_BASE_URL: http://127.0.0.1:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install tox
        run: uv pip install --system tox tox-uv

      - name: Run coverage
        run: tox -e coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage.xml
          fail_ci_if_error: true

      # Real release gate — tag-only, inert until v1.0.0 (--fail-under=0
      # in pyproject.toml's [tool.tox.env."coverage-gate"]). Reads the
      # .coverage file produced by the "Run coverage" step above; does
      # not re-run pytest.
      - name: Enforce coverage gate (release only, inactive before v1.0.0)
        if: startsWith(github.ref, 'refs/tags/')
        run: tox -e coverage-gate

  # ---------------------------------------------------------------------------
  # Build — version consistency check + package build, tag-only
  # ---------------------------------------------------------------------------
  build:
    name: Verify version and build package
    runs-on: ubuntu-latest
    # Both required explicitly: coverage no longer implies test-integration
    # succeeded (they run independently since 2026-07-27, Option B) — a tag
    # push runs both, and build must wait for both to pass.
    needs: [coverage, test-integration]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build packaging

      - name: Verify version consistency
        id: version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          from packaging import version as pkg_version

          # Version from the git tag (strip leading 'v')
          tag = os.environ["GITHUB_REF_NAME"]
          tag_version = tag.lstrip("v")

          # Version from pyproject.toml
          with open("pyproject.toml", "rb") as f:
              pyproject_version = tomllib.load(f)["project"]["version"]

          # Version from src/i18n_tools/__static__.py
          # (NOT __init__.py: __version__ was moved to __static__.py, DD-21 v0.4.x update,
          # to resolve a circular import)
          static_file = Path("src/i18n_tools/__static__.py")
          static_version = None
          match = re.search(
              r'__version__\s*=\s*["\']([^"\']+)["\']', static_file.read_text()
          )
          if match:
              static_version = match.group(1)

          print(f"Tag version:              {tag_version}")
          print(f"pyproject.toml:            {pyproject_version}")
          print(f"src/i18n_tools/__static__.py: {static_version}")

          errors = []
          if pkg_version.parse(tag_version) != pkg_version.parse(pyproject_version):
              errors.append(
                  f"Tag ({tag_version}) does not match pyproject.toml ({pyproject_version})"
              )
          if static_version is None:
              errors.append("Could not find __version__ in src/i18n_tools/__static__.py")
          elif pkg_version.parse(tag_version) != pkg_version.parse(static_version):
              errors.append(
                  f"Tag ({tag_version}) does not match __static__.py ({static_version})"
              )

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={tag_version}\n")
              f.write(f"tag={tag}\n")

          print(f"✅ All versions consistent: {tag_version}")
          EOF

      - name: Build package
        run: |
          python -m build
          echo "✅ Build completed"
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

  # ---------------------------------------------------------------------------
  # Publish — final tags go to PyPI, rc tags go to TestPyPI
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'rc')

    permissions:
      contents: write   # required by softprops/action-gh-release to create the release

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-testpypi:
    name: Publish release candidate to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, 'rc')

    permissions:
      contents: write   # required by softprops/action-gh-release to create the release

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: "RC — ${{ needs.build.outputs.tag }}"
          prerelease: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
